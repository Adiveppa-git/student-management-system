<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details | Student Success & Early Warning System</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <div>
                <h1 class="brand-title">🎓 Student Success & Early Warning System</h1>
                <p class="brand-subtitle">Student details</p>
            </div>
            <nav class="nav-tabs" aria-label="Student navigation">
                <a class="tab-btn" href="students.html">👥 Back to Student List</a>
                <a class="tab-btn" href="index.html">🏠 Back to Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="main-wrapper">
        <section class="container" aria-labelledby="student-details-heading">
            <h2 id="student-details-heading">Student Details</h2>
            <p id="studentDetailsStatus" class="student-details-error" role="status" aria-live="polite">Loading student details...</p>
            <dl id="studentDetailsContent" class="student-details-grid" aria-live="polite"></dl>
        </section>
    </main>

    <footer class="app-footer">
        <p>AI-Powered Student Success & Early Warning System | Built with FastAPI, Scikit-learn & MongoDB</p>
    </footer>

    <script src="js/api.js" defer></script>
    <script src="js/student-details.js" defer></script>
</body>
</html>
